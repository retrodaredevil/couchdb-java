import java.time.Duration

buildscript {
    ext {
        junitVersion = '6.1.3' // https://docs.junit.org/current/

        slf4jVersion = '2.0.20' // http://www.slf4j.org/download.html
        // https://github.com/FasterXML/jackson/wiki/Jackson-Releases
        jacksonVersion = '2.22.4' // https://github.com/FasterXML/jackson-databind/releases
        // retrofit is why we need allow-opens. context: https://stackoverflow.com/questions/60915381/retrofit2-maven-project-illegal-reflective-access-warning // https://github.com/square/retrofit/issues/3341
        retrofitVersion = "3.0.0" // https://github.com/square/retrofit/releases
        okhttpVersion = "5.5.1" // https://mvnrepository.com/artifact/com.squareup.okhttp3/okhttp
        dockerComposePluginVersion = "0.17.21" // https://github.com/avast/gradle-docker-compose-plugin/releases
    }
}

plugins {
    id "com.avast.gradle.docker-compose" version "$dockerComposePluginVersion"
    id "net.ltgt.errorprone" version "5.2.0" apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.ltgt.errorprone'
    apply plugin: 'maven-publish' // necessary for jitpack
    apply plugin: 'docker-compose'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    // The published library targets Java 8; tests use the build toolchain's JDK.
    tasks.named('compileJava', JavaCompile) {
        options.release = 8
    }
    tasks.named('compileTestJava', JavaCompile) {
        sourceCompatibility = '25'
        targetCompatibility = '25'
    }
    ['testCompileClasspath', 'testRuntimeClasspath'].each { configurationName ->
        configurations.named(configurationName) {
            attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
    tasks.withType(Test).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
    repositories {
        maven { url "https://repo.maven.apache.org/maven2" }
    }
    dependencies {
        testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: junitVersion
        testImplementation "org.junit.jupiter:junit-jupiter-params:$junitVersion"
        testImplementation "org.junit.platform:junit-platform-commons:$junitVersion"
        testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: junitVersion

        testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitVersion"

        api 'org.jspecify:jspecify:1.0.1'
        errorprone 'com.google.errorprone:error_prone_core:2.52.0'
        errorprone 'com.uber.nullaway:nullaway:0.14.3'
        compileOnly 'com.google.errorprone:error_prone_annotations:2.52.0'
    }
    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            disableWarningsInGeneratedCode = true
            excludedPaths = '.*/build/generated.*/.*'
            error('NullAway')
            option('NullAway:OnlyNullMarked', 'true')
            option('NullAway:JSpecifyMode', 'true')
            option('NullAway:AcknowledgeRestrictiveAnnotations', 'true')
            error('RequireExplicitNullMarking')
            warn('AnnotationPosition')

            disable('MissingSummary')
            disable('StringSplitter')
            disable('EqualsGetClass')
            disable('InvalidLink')
            disable('ComparableType')
            disable('DoNotClaimAnnotations')
            disable('InlineMeSuggester')
            disable('EmptyCatch')
            disable('FutureReturnValueIgnored')
            disable('UnusedVariable')
            disable('CanonicalDuration')
            disable('EffectivelyPrivate')

            error('MissingOverride')
            error('AssignmentExpression')
            error('NullableOnContainingClass')
            warn('UnusedMethod')
            error('StatementSwitchToExpressionSwitch')
            error('PatternMatchingInstanceof')

            enable('ClassName')
            warn('DepAnn')
            warn('EmptyIf')
            warn('InsecureCryptoUsage')
            warn('ConstantPatternCompile')
            warn('DifferentNameButSame')
            error('EqualsBrokenForNull')
            warn('InconsistentOverloads')
            warn('InitializeInline')
            warn('InterfaceWithOnlyStatics')
            warn('InterruptedExceptionSwallowed')
            warn('Interruption')
            warn('NonCanonicalStaticMemberImport')
            warn('RedundantOverride')
            warn('RedundantThrows')
            warn('TransientMisuse')
            warn('TryWithResourcesVariable')
            warn('UnnecessarilyFullyQualified')
            warn('UnnecessaryAnonymousClass')
            warn('UnusedException')

            error('FieldMissingNullable')
            error('ParameterMissingNullable')
            // Flag parameters whose implementations meaningfully accept null.
            option('Nullness:Conservative', 'false')
            error('ReturnMissingNullable')

            warn('ConstantField')
            warn('FieldCanBeLocal')
            warn('FieldCanBeStatic')
            warn('ForEachIterable')
            warn('LambdaFunctionalInterface')
            if (!name.toLowerCase().contains('test')) {
                warn('MethodCanBeStatic')
            }
            error('MixedArrayDimensions')
            error('MultipleTopLevelClasses')
            error('PackageLocation')
            error('PrivateConstructorForUtilityClass')
            warn('RemoveUnusedImports')
            error('ReturnsNullCollection')
            error('SwitchDefault')
            error('SymbolToString')
            warn('ThrowsUncheckedException')
            warn('TryFailRefactoring')
            error('TypeToString')
            warn('UnnecessaryBoxedAssignment')
            warn('UnnecessaryBoxedVariable')
            error('UnnecessaryStaticImport')
        }
    }
    test {
        useJUnitPlatform {
            excludeTags 'integration'
        }
        if(JavaVersion.current() >= JavaVersion.VERSION_1_9) {
            // If we don't have this, we get warnings for something about retrofit2.Platform
            jvmArgs "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED"
        }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile){
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
    tasks.register('integration', Test) {
        useJUnitPlatform {
            includeTags 'integration'
        }
        if (JavaVersion.current() >= JavaVersion.VERSION_1_9) {
            // If we don't have this, we get warnings for something about retrofit2.Platform
            jvmArgs "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED"
        }
    }
    dockerCompose {
        useComposeFiles = ['../testing/docker-compose.yml']
        isRequiredBy integration
        waitForTcpPortsTimeout = Duration.ofMinutes(1)
    }

    publishing { // necessary for jitpack
        publications {
            mavenJava(MavenPublication) {
                // thanks https://stackoverflow.com/a/68515859/5434860
                groupId = "${group}"
                artifactId = "${project.name}"
                version = "${version}"

                from project.components.java
            }
        }
    }
}

wrapper {
    gradleVersion = '9.8.2'
    distributionType = Wrapper.DistributionType.ALL
}
